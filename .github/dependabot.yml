version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - frontend
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      - dependency-name: "eslint"
        update-types:
          - version-update:semver-major
      - dependency-name: "lucide-react"
        update-types:
          - version-update:semver-major
    groups:
      web-production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      web-development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
  - package-ecosystem: pip
    directory: /apps/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - backend
    groups:
      api-production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      api-development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - infra
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      github-actions:
        patterns:
          - "*"
