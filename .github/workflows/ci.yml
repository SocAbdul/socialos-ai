name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: socialos
          POSTGRES_USER: socialos
          POSTGRES_PASSWORD: socialos-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U socialos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://socialos:socialos-ci@localhost:5432/socialos
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-groups --frozen
      - run: uv export --frozen --no-dev --no-hashes --no-emit-project --format requirements.txt --output-file /tmp/socialos-api-requirements.txt
      - run: uvx pip-audit --strict --progress-spinner off -r /tmp/socialos-api-requirements.txt
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests
      - run: uv run alembic upgrade head
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run test:e2e

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - name: Validate staging tfvars generator
        working-directory: .
        env:
          AWS_REGION: eu-west-1
          S3_MEDIA_BUCKET: socialos-ci-media-bucket
          STAGING_WEB_ORIGIN: https://staging.socialos.ai/
          MONTHLY_BUDGET_LIMIT_USD: "25"
          BUDGET_ALERT_EMAIL: alerts@example.com
          GITHUB_REPOSITORY: ${{ github.repository }}
          CLERK_JWKS_URL: https://example.clerk.accounts.dev/.well-known/jwks.json
          CLERK_ISSUER: https://example.clerk.accounts.dev
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_example
          TOKEN_ENCRYPTION_KEY_SECRET_ARN: arn:aws:ssm:eu-west-1:123456789012:parameter/socialos/staging/TOKEN_ENCRYPTION_KEY
          CLERK_SECRET_KEY_SECRET_ARN: arn:aws:ssm:eu-west-1:123456789012:parameter/socialos/staging/CLERK_SECRET_KEY
          ENABLE_STAGING_RUNTIME: "true"
          STAGING_API_IMAGE: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/socialos-staging/api:ci
          STAGING_WEB_IMAGE: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/socialos-staging/web:ci
          STAGING_DESIRED_COUNT: "1"
          STAGING_SECRET_KMS_KEY_ARNS_HCL: "[]"
        run: |
          python .github/scripts/write_staging_tfvars.py "${RUNNER_TEMP}/socialos-staging.auto.tfvars"
          terraform fmt -check "${RUNNER_TEMP}/socialos-staging.auto.tfvars"
      - run: terraform fmt -check -recursive
      - name: Validate dev Terraform
        run: |
          cd environments/dev
          terraform init -backend=false
          terraform validate
      - name: Validate staging Terraform
        run: |
          cd environments/staging
          terraform init -backend=false
          terraform validate
      - name: Validate state bootstrap Terraform
        run: |
          cd bootstrap/state
          terraform init -backend=false
          terraform validate

  containers:
    runs-on: ubuntu-latest
    needs: [api, web, infra]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build production API image
        run: docker build --target production -t socialos-api:${{ github.sha }} apps/api
      - name: Build production web image
        run: docker build --target production -t socialos-web:${{ github.sha }} apps/web
      - name: Validate Docker Compose
        run: docker compose config
      - name: Validate production-shaped runtime contract
        env:
          RUNTIME_ENV_FILE: .env.staging.example
          IMAGE_TAG: ${{ github.sha }}
        run: docker compose -f docker-compose.runtime.yml config
      - name: Reject machine-specific runtime dependencies
        run: |
          ! grep -R -E 'C:\\dev|trycloudflare\.com|host\.docker\.internal|socialos-preview' apps/api/src apps/web/src
      - name: Start complete development stack
        run: docker compose up --build --wait --wait-timeout 180
      - name: Verify API, web, Redis and worker
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/health/live
          curl --fail --silent --show-error http://127.0.0.1:3000 > /dev/null
          docker compose exec -T redis redis-cli ping | grep -q PONG
          docker compose exec -T worker celery -A socialos.infrastructure.tasks.celery_app inspect ping --timeout=5 | grep -q pong
      - name: Print stack diagnostics
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down -v --remove-orphans
