# Production-shaped runtime contract. It does not provision database, Redis, TLS or storage.
name: socialos-runtime

services:
  migrate:
    image: ${API_IMAGE:-socialos-api}:${IMAGE_TAG:-local}
    profiles: ["release"]
    command: ["alembic", "upgrade", "head"]
    env_file: ["${RUNTIME_ENV_FILE:-.env.runtime}"]
    restart: "no"

  api:
    image: ${API_IMAGE:-socialos-api}:${IMAGE_TAG:-local}
    env_file: ["${RUNTIME_ENV_FILE:-.env.runtime}"]
    restart: unless-stopped
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    image: ${API_IMAGE:-socialos-api}:${IMAGE_TAG:-local}
    env_file: ["${RUNTIME_ENV_FILE:-.env.runtime}"]
    command: ["celery", "-A", "socialos.infrastructure.tasks.celery_app", "worker", "--loglevel=INFO"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A socialos.infrastructure.tasks.celery_app inspect ping --timeout=10 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  web:
    image: ${WEB_IMAGE:-socialos-web}:${IMAGE_TAG:-local}
    environment:
      API_INTERNAL_URL: http://api:8000/api/v1
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      NEXT_PUBLIC_DEMO_MODE: "false"
    restart: unless-stopped
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
