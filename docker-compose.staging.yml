# Runtime only. This file never provisions Hetzner, R2, DNS, domains or secrets.
name: socialos-staging

x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-api-runtime: &api-runtime
  image: ${API_IMAGE:?Set API_IMAGE}:${RELEASE_SHA:?Set RELEASE_SHA}
  env_file:
    - ${STAGING_ENV_FILE:-.env.staging}
  environment:
    RELEASE_SHA: ${RELEASE_SHA:?Set RELEASE_SHA}
  networks: [private]
  logging: *json-logging

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [private]
    restart: unless-stopped
    logging: *json-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:8-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command:
      - sh
      - -ec
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis_data:/data
    networks: [private]
    restart: unless-stopped
    logging: *json-logging
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    <<: *api-runtime
    profiles: [release]
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api-runtime
    expose: ["8000"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *api-runtime
    command: ["celery", "-A", "socialos.infrastructure.tasks.celery_app", "worker", "--loglevel=INFO"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A socialos.infrastructure.tasks.celery_app inspect ping --timeout=10 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  web:
    image: ${WEB_IMAGE:?Set WEB_IMAGE}:${RELEASE_SHA:?Set RELEASE_SHA}
    environment:
      API_INTERNAL_URL: http://api:8000/api/v1
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?Set NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      NEXT_PUBLIC_DEMO_MODE: "false"
      NODE_ENV: production
      RELEASE_SHA: ${RELEASE_SHA:?Set RELEASE_SHA}
    expose: ["3000"]
    networks: [private]
    restart: unless-stopped
    logging: *json-logging
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    image: caddy:2.10-alpine
    environment:
      CADDY_APP_HOST: ${CADDY_APP_HOST:?Set CADDY_APP_HOST}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:?Set CADDY_ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/staging/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge, private]
    restart: unless-stopped
    logging: *json-logging
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

networks:
  edge:
  private:
    internal: true

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
